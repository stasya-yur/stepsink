<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фон: фірмовий градієнт бренду StepSync -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6a8cff"/>
      <stop offset="1" stop-color="#1e3799"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
<!-- Буква S (StepSync) у лівому верхньому куті -->
  <text x="10" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="25" font-weight="900" fill="#ffffff">S</text>

  <!-- Гистограмма-лесенка: 3 столбика разной высоты вплотную,
       их верхушки образуют ступенчатую линию вверх -->
  <g fill="#ffffff">
    <rect x="10" y="40" width="14" height="14"/>
    <rect x="26" y="31" width="14" height="23"/>
    <rect x="42" y="22" width="14" height="32"/>
  </g>

  <!-- Основа / базова лінія -->
</svg>
