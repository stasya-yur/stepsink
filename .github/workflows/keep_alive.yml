name: Keep Supabase Alive

on:
  schedule:
    # Запуск щодня о 12:00 за Гринвічем (UTC)
    - cron: '0 12 * * *'
  # Дозволяє також запустити будильник вручну кнопкою на GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request to Supabase
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
