<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід / Реєстрація</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body class="auth-wrapper">

    <div class="auth-container">
        <div class="auth-tabs">
            <button class="auth-tab-btn active" onclick="switchAuthTab('login')">Вхід</button>
            <button class="auth-tab-btn" onclick="switchAuthTab('register')">Реєстрація</button>
        </div>

        <form id="login-form" class="auth-form active-form">
            <h2>Вхід у систему</h2>
            <div class="form-group">
                <label>Логін</label>
                <input type="text" id="login-login" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-full">Увійти</button>
        </form>

        <form id="register-form" class="auth-form">
            <h2>Реєстрація</h2>
            <div class="form-group">
                <label>Логін</label>
                <input type="text" id="reg-login" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="reg-password" required>
            </div>
            <div class="form-group">
                <label>Підтвердження пароля</label>
                <input type="password" id="reg-password-confirm" required>
            </div>
            <button type="submit" class="btn btn-primary w-full">Зареєструватися</button>
        </form>
    </div>

    <script>
        checkAuthAndRedirect();

        function switchAuthTab(type) {
            document.querySelectorAll('.auth-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active-form'));
            
            if (type === 'login') {
                document.querySelectorAll('.auth-tab-btn')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active-form');
            } else {
                document.querySelectorAll('.auth-tab-btn')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active-form');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login-login').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                await customLogin(login, password);
                window.location.href = 'club.html';
            } catch (error) {
                alert('Помилка входу: ' + error.message);
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('reg-login').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordConfirm = document.getElementById('reg-password-confirm').value;

            if (password !== passwordConfirm) {
                alert('Паролі не співпадають');
                return;
            }

            try {
                await customRegister(login, password);
                alert('Реєстрація успішна!');
                window.location.href = 'club.html';
            } catch (error) {
                alert('Помилка реєстрації: ' + error.message);
            }
        });
    </script>
</body>
</html>
